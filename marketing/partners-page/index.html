<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Berlin — Partner Decks</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --black: #0a0a0a;
    --card: #161616;
    --border: #2a2a2a;
    --text: #e8e8e8;
    --text-dim: #888888;
    --text-muted: #555555;
    --accent: #c8ff00;
    --accent-dim: rgba(200, 255, 0, 0.15);
    --white: #ffffff;
  }

  html, body {
    min-height: 100vh;
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--black);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 12vh 2rem 6vh;
  }

  .eyebrow {
    font-size: 0.7rem; font-weight: 600;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 1.5rem;
  }

  h1 {
    font-size: clamp(1.8rem, 3.5vw, 2.6rem);
    font-weight: 700; line-height: 1.15;
    letter-spacing: -0.03em;
    color: var(--white);
  }

  .subtitle {
    font-size: 1rem; font-weight: 300;
    line-height: 1.6; color: var(--text-dim);
    margin-top: 1rem; max-width: 520px;
  }

  .thin-line {
    width: 60px; height: 1px;
    background: var(--accent);
    margin: 2.5rem 0;
  }

  .deck-list {
    display: flex; flex-direction: column;
    gap: 1rem;
  }

  .deck-link {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1.5rem 2rem;
    text-decoration: none;
    color: var(--text);
    transition: border-color 0.2s ease, background 0.2s ease;
  }
  .deck-link:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .deck-info { flex: 1; }

  .deck-label {
    font-size: 0.6rem; font-weight: 600;
    letter-spacing: 0.15em; text-transform: uppercase;
    color: var(--accent); margin-bottom: 0.4rem;
  }

  .deck-title {
    font-size: 1.1rem; font-weight: 600;
    color: var(--white); line-height: 1.3;
  }

  .deck-desc {
    font-size: 0.8rem; color: var(--text-dim);
    margin-top: 0.3rem;
  }

  .deck-arrow {
    font-size: 1.2rem; color: var(--text-muted);
    margin-left: 1.5rem;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  .deck-link:hover .deck-arrow {
    color: var(--accent);
    transform: translateX(4px);
  }

  .footer {
    margin-top: 4rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--text-muted);
  }
</style>
</head>
<body>
<div class="page">
  <div class="eyebrow">Internal</div>
  <h1>Partner Decks</h1>
  <p class="subtitle">Founding Partner Program slide decks by ICP. Open a deck and use arrow keys to navigate.</p>
  <div class="thin-line"></div>

  <div class="deck-list">

    <a href="saas.html" class="deck-link">
      <div class="deck-info">
        <div class="deck-label">ICP 3</div>
        <div class="deck-title">Series B–C SaaS In-House SEO Teams</div>
        <div class="deck-desc">15 slides — problem narrative, architecture, ROI, Founding Partner pricing &amp; perks</div>
      </div>
      <div class="deck-arrow">&rarr;</div>
    </a>

    <!-- Add future ICP decks here:
    <a href="agency.html" class="deck-link">
      <div class="deck-info">
        <div class="deck-label">ICP X</div>
        <div class="deck-title">Deck Title</div>
        <div class="deck-desc">Description</div>
      </div>
      <div class="deck-arrow">&rarr;</div>
    </a>
    -->

  </div>

  <div class="footer">Berlin &mdash; The SEO Agent Platform</div>
</div>
</body>
</html>
