[project]
name = "salesx"
version = "0.2.0"
description = "Sales-layer CLI — discovery, enrichment, outreach, and CRM over one interface."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.7",
]

[project.scripts]
salesx = "salesx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/salesx"]
